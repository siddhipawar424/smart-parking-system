spring.application.name=smart-parking-api
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# ── Database ─────────────────────────────────────────────────────────────────
# Override any of these with OS environment variables in production.
# Defaults below work for a standard local MySQL setup.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_parking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP defaults)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:SmartParkingDefaultSecretKeyChangeInProduction2024!}
jwt.expiration=${JWT_EXPIRATION:86400000}
